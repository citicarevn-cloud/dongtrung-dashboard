<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống Đặt hàng Đông Trùng</title>
    
    <!-- Open Graph Meta Tags dành cho Facebook -->
    <meta property="og:title" content="Hệ thống Đặt hàng Đông Trùng">
    <meta property="og:description" content="Truy cập hệ thống để đặt hàng và theo dõi thông tin sản phẩm đông trùng hạ thảo trực tuyến nhanh chóng.">
    <!-- THAY LINK ẢNH THUMBNAIL CỦA BẠN VÀO DÒNG BÊN DƯỚI -->
    <meta property="og:image" content="https://link-den-buc-anh-thumbnail-cua-ban.jpg">
    <meta property="og:type" content="website">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #e8f5e9; color: #2e7d32; }
        
        #fallback-message { display: none; text-align: center; padding: 20px; box-sizing: border-box; height: 100%; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 40px; }
        
        /* Hiệu ứng mũi tên chỉ lên góc phải */
        .arrow-up { font-size: 50px; color: #2e7d32; align-self: flex-end; margin-right: 20px; margin-bottom: 20px; animation: bounceRight 1.5s infinite; transform: rotate(45deg); }
        @keyframes bounceRight { 0%, 100% { transform: translate(0, 0) rotate(45deg); } 50% { transform: translate(15px, -15px) rotate(45deg); } }
        
        .container { background-color: #ffffff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(46, 125, 50, 0.1); max-width: 90%; width: 400px; text-align: center; }
        .icon-dots { font-size: 28px; font-weight: bold; letter-spacing: 3px; color: #1b5e20; background: #c8e6c9; padding: 5px 20px; border-radius: 20px; display: inline-block; margin-bottom: 20px; }
        
        h2 { margin-top: 0; font-size: 22px; font-weight: 700; color: #1b5e20; }
        p { font-size: 16px; line-height: 1.6; margin-bottom: 20px; color: #388e3c; }
        .highlight { font-weight: 700; color: #1b5e20; background: #c8e6c9; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="fallback-message">
        <!-- Mũi tên chỉ về hướng dấu 3 chấm trên trình duyệt Facebook iOS -->
        <div class="arrow-up">➚</div>
        
        <div class="container">
            <div class="icon-dots">...</div>
            <h2>Gần xong rồi!</h2>
            <p>Để hệ thống quản lý đơn hàng hoạt động mượt mà, Facebook yêu cầu mở bằng trình duyệt của máy.</p>
            <p>Bạn vui lòng bấm vào biểu tượng <span class="highlight">3 chấm (...)</span> ở góc trên cùng bên phải màn hình và chọn:</p>
            <p><span class="highlight">"Mở trong Safari"</span> hoặc <span class="highlight">"Mở bằng trình duyệt ngoài"</span>.</p>
        </div>
    </div>

    <script>
        // Kiểm tra xem người dùng có đang mở bằng trình duyệt nội bộ của Facebook không
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var isFacebookApp = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
        var gasUrl = "https://script.google.com/macros/s/AKfycbxZTwtQOMZcOAtQoulE3Q1VdxdikC-o4IBWrSyZ5k2ytUhWWEGyIgIisa3NGAzRbrE/exec";
        
        if (!isFacebookApp) {
            // Nếu dùng trình duyệt thường hoặc Zalo, Telegram -> Vẫn tự động chuyển hướng trơn tru
            window.location.replace(gasUrl);
        } else {
            // Nếu dùng Facebook -> Hiện thông báo màu xanh thẩm mỹ yêu cầu thao tác thủ công
            document.getElementById('fallback-message').style.display = 'flex';
        }
    </script>

</body>
</html>
