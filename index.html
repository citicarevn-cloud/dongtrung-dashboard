<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đặt hàng & Quản lý Đông Trùng</title>
    
    <!-- Open Graph Meta Tags dành cho Facebook -->
    <meta property="og:title" content="Hệ thống Đặt hàng & Quản lý Đông Trùng">
    <meta property="og:description" content="Truy cập hệ thống để đặt hàng và theo dõi thông tin sản phẩm đông trùng hạ thảo trực tuyến nhanh chóng.">
    <!-- Nhớ thay link ảnh thumbnail của bạn vào dòng dưới -->
    <meta property="og:image" content="https://link-den-buc-anh-thumbnail-cua-ban.jpg">
    <meta property="og:type" content="website">

    <style>
        /* CSS loại bỏ viền và thiết lập giao diện toàn màn hình */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        /* Giao diện màn hình chờ (Loading Screen) màu xanh lá hiện đại */
        #loader { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #f4fbf4; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            transition: opacity 0.5s ease; 
        }
        .spinner { 
            border: 4px solid #d1ead1; 
            border-top: 4px solid #2ecc71; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin-bottom: 15px; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .loader-text { 
            color: #27ae60; 
            font-size: 16px; 
            font-weight: 500; 
        }
        
        /* Iframe chứa Google Apps Script */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ trong lúc tải dữ liệu từ Google -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Đang tải hệ thống Đông Trùng...</div>
    </div>

    <!-- Nhúng trực tiếp link Google Apps Script -->
    <iframe id="gas-frame" src="https://script.google.com/macros/s/AKfycbxZTwtQOMZcOAtQoulE3Q1VdxdikC-o4IBWrSyZ5k2ytUhWWEGyIgIisa3NGAzRbrE/exec"></iframe>

    <script>
        // Tự động ẩn màn hình chờ khi hệ thống Google Apps Script đã tải xong
        document.getElementById('gas-frame').onload = function() {
            var loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(function() {
                loader.style.display = 'none';
            }, 500);
        };
    </script>

</body>
</html>
